<!doctype html>
<html lang="{{ language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} – {{ company }}</title>
  <style>
    :root { --ink:#1f2933; --muted:#52606d; --accent:#F77F00; --green:#009E60; --bg:#fff; }
    @media (prefers-color-scheme: dark) { :root { --ink:#e4e7eb; --muted:#9aa5b1; --bg:#121417; } }
    body { font: 16px/1.6 system-ui, sans-serif; color: var(--ink); background: var(--bg);
           max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { color: var(--green); font-size: 1.7rem; margin-bottom: .2rem; }
    h2 { font-size: 1.15rem; margin-top: 1.8rem; }
    .meta, nav { color: var(--muted); font-size: .9rem; }
    nav a { color: var(--accent); margin-right: 12px; }
    .draft { border-left: 4px solid var(--accent); padding: 8px 12px; background: rgba(247,127,0,.08); }
  </style>
</head>
<body>
  <nav>{% for code in languages %}<a href="?lang={{ code }}">{{ code|upper }}</a>{% endfor %}</nav>
  {% block content %}{% endblock %}
</body>
</html>
