name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tourism
          POSTGRES_USER: tourism
          POSTGRES_PASSWORD: tourism
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DEBUG: "True"
      DATABASE_URL: postgres://tourism:tourism@localhost:5432/tourism
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (PostgreSQL)
        run: python manage.py test apps --verbosity=1
      - name: Production checks
        env:
          DEBUG: "False"
          SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-django-checks-123
          ALLOWED_HOSTS: api.example.com
        run: python manage.py check --deploy --fail-level ERROR

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tourism-backend .
