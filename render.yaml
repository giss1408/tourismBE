# Render Blueprint: Dashboard › New › Blueprint, pick this repository.
# Values marked `sync: false` are asked for when the Blueprint is created.
# Step-by-step guide: README.md › Deploy on Render.

envVarGroups:
  - name: akwaba-shared
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      # Render secret file (Service › Environment › Secret Files), optional:
      # push notifications are off while it is missing.
      - key: FCM_CREDENTIALS_FILE
        value: /etc/secrets/firebase-service-account.json

services:
  - type: web
    name: akwaba-api
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /healthz/
    # A failed migration stops the deploy; the running version stays up.
    preDeployCommand: python manage.py migrate --noinput
    autoDeploy: true
    envVars:
      - fromGroup: akwaba-shared
      - key: RUN_MIGRATIONS
        value: "0"
      - key: GUNICORN_WORKERS
        value: "2"
      # Render's load balancer is the one proxy in front of gunicorn.
      - key: NUM_PROXIES
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: akwaba-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: akwaba-cache
          property: connectionString
      # The *.onrender.com host is added automatically; list a custom domain
      # here (and in CSRF_TRUSTED_ORIGINS / PUBLIC_BASE_URL) once attached.
      - key: ALLOWED_HOSTS
        value: localhost
      - key: CORS_ALLOWED_ORIGINS
        value: https://akwaba-ivoire.com

      # Operator
      - key: COMPANY_NAME
        value: Akwaba Ivoire
      - key: SUPPORT_EMAIL
        value: support@akwaba-ivoire.com
      - key: SUPPORT_WHATSAPP
        sync: false
      - key: BOOKING_SERVICE_FEE_EUR
        value: "29"
      - key: FREE_CANCELLATION_DAYS
        value: "7"

      # Photos and videos: S3-compatible bucket (Cloudflare R2 recommended)
      - key: MEDIA_BUCKET
        sync: false
      - key: MEDIA_ENDPOINT_URL
        sync: false
      - key: MEDIA_ACCESS_KEY_ID
        sync: false
      - key: MEDIA_SECRET_ACCESS_KEY
        sync: false
      - key: MEDIA_PUBLIC_DOMAIN
        sync: false

      # Email (SMTP: Brevo, Mailjet, SES…)
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: Akwaba Ivoire <support@akwaba-ivoire.com>

      # Stripe; webhook: https://<host>/payments/stripe/webhook/
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: SENTRY_DSN
        sync: false

  # Rate-limiting counters shared by every gunicorn worker.
  - type: keyvalue
    name: akwaba-cache
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []  # reachable from Render services only

  # Push reminder the day before check-in (09:00 UTC).
  - type: cron
    name: akwaba-trip-reminders
    runtime: docker
    plan: starter
    region: frankfurt
    schedule: "0 9 * * *"
    dockerCommand: python manage.py send_trip_reminders
    envVars:
      - fromGroup: akwaba-shared
      - key: DATABASE_URL
        fromDatabase:
          name: akwaba-db
          property: connectionString

# Render backs up paid PostgreSQL instances (point-in-time recovery), so the
# pg_dump job of the self-hosted stack is not needed here.
databases:
  - name: akwaba-db
    plan: basic-256mb
    region: frankfurt
    databaseName: tourism
    user: tourism
    postgresMajorVersion: "16"
    ipAllowList: []  # reachable from Render services only
